<!DOCTYPE html>
<html lang="es-ES">
    <head>
        <meta charset="UTF-8">
        <title>Script en el mismo archivo</title>
        <script>
            const saludar = () => {
                alert('Hola ciudad desde la asignatura DWEC');
            }
        </script>
    </head>
    <body>
        <h1>
            Hola ciudad desde la asignatura DWEC
        </h1>
        <button onclick="saludar()">Saludar</button>
    </body>
</html>
